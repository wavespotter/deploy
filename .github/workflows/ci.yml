name: CI

on:
    push:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - name: Install dependencies
              run: npm install
            - name: Lint
              run: npm run lint
    test:
        name: Run tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
